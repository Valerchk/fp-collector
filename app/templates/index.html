<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f4;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e2e0;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
    }
    h1 { font-size: 21px; font-weight: 600; margin-bottom: 6px; color: #1a1a1a; }
    .sub { font-size: 14px; color: #888; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #444; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 13px;
      border: 1px solid #d5d5d3; border-radius: 8px;
      font-size: 15px; outline: none; margin-bottom: 16px;
      transition: border-color .15s;
    }
    input:focus { border-color: #4f7cff; }
    button {
      width: 100%; padding: 11px;
      background: #4f7cff; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: #3a63e0; }
  </style>
</head>
<body>

<div class="card">
  <h1>Sign in</h1>
  <p class="sub">Enter your credentials to continue.</p>
  <label>Email</label>
  <input id="inp-email" type="email" placeholder="you@example.com" autocomplete="email"/>
  <label>Password</label>
  <input id="inp-password" type="password" placeholder="••••••••" autocomplete="current-password"/>
  <button type="button" id="btn-submit">Continue</button>
</div>

<script>
(function () {
  const VISITOR_ID  = {{ visitor_id }};
  const COLLECT_URL = "/fp-collector/login/api/collect";
  const t0 = Date.now();

  // ── Behavioral signals ────────────────────────────────────────
  const behavior = {
    mouse_moves:       0,
    mouse_move_times:  [],   // timestamps of moves (last 20)
    scroll_events:     0,
    click_x:           null,
    click_y:           null,
    key_intervals:     [],   // ms between keystrokes
    last_key_time:     null,
    hesitations:       0,    // pauses > 500ms between keys
    first_interaction: null, // ms from page load to first event
  };

  function markFirst() {
    if (behavior.first_interaction === null)
      behavior.first_interaction = Date.now() - t0;
  }

  document.addEventListener("mousemove", function(e) {
    markFirst();
    behavior.mouse_moves++;
    const now = Date.now();
    behavior.mouse_move_times.push(now);
    if (behavior.mouse_move_times.length > 20)
      behavior.mouse_move_times.shift();
  }, { passive: true });

  document.addEventListener("scroll", function() {
    markFirst();
    behavior.scroll_events++;
  }, { passive: true });

  document.addEventListener("click", function(e) {
    markFirst();
    behavior.click_x = e.clientX;
    behavior.click_y = e.clientY;
  });

  document.addEventListener("keydown", function() {
    markFirst();
    const now = Date.now();
    if (behavior.last_key_time !== null) {
      const interval = now - behavior.last_key_time;
      behavior.key_intervals.push(interval);
      if (interval > 500) behavior.hesitations++;
    }
    behavior.last_key_time = now;
  });

  // Calcule vitesse moyenne de frappe (ms entre touches)
  function avgKeyInterval() {
    if (behavior.key_intervals.length === 0) return 0;
    const sum = behavior.key_intervals.reduce((a, b) => a + b, 0);
    return Math.round(sum / behavior.key_intervals.length);
  }

  // Calcule vitesse moyenne de mouvement souris (events/sec)
  function mouseSpeed() {
    const times = behavior.mouse_move_times;
    if (times.length < 2) return 0;
    const duration = (times[times.length - 1] - times[0]) / 1000;
    return duration > 0 ? Math.round(times.length / duration) : 0;
  }

  // ── WebGL GPU info ────────────────────────────────────────────
  function getWebGL() {
    try {
      const c  = document.createElement("canvas");
      const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if (!gl) return { supported: false, benchmark_ms: 0 };
      const ext = gl.getExtension("WEBGL_debug_renderer_info");

      // ── GPU Benchmark — stress test WebGL ──────────────────
      // Fait 1 000 000 opérations gl.clear → mesure le temps
      // VM/headless = lent (>100ms), vrai GPU = rapide (<20ms)
      const bStart = performance.now();
      for (let i = 0; i < 1_000_000; i++) {
        gl.clear(gl.COLOR_BUFFER_BIT);
      }
      const benchmarkMs = Math.round(performance.now() - bStart);

      return {
        supported:    true,
        vendor:       ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL)   : "",
        renderer:     ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "",
        benchmark_ms: benchmarkMs,
      };
    } catch { return { supported: false, benchmark_ms: 0 }; }
  }

  // ── WebGPU GPU info ───────────────────────────────────────────
  async function getWebGPU() {
    try {
      if (!navigator.gpu) return { supported: false };
      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return { supported: false };
      const info = await adapter.requestAdapterInfo();
      return { supported: true, vendor: info.vendor || "", device: info.device || "" };
    } catch { return { supported: false }; }
  }

  // ── Canvas fingerprint hash ───────────────────────────────────
  function getCanvasHash() {
    try {
      const c   = document.createElement("canvas");
      const ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillStyle = "#f00";
      ctx.fillRect(0, 0, 60, 20);
      ctx.fillStyle = "#00f";
      ctx.fillText("fp", 2, 2);
      const raw = c.toDataURL();
      let h = 0;
      for (let i = 0; i < raw.length; i++) {
        h = (Math.imul(31, h) + raw.charCodeAt(i)) | 0;
      }
      return (h >>> 0).toString(16);
    } catch { return ""; }
  }

  // ── FingerprintJS v4 ──────────────────────────────────────────
  const script = document.createElement("script");
  script.src = "https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.umd.min.js";
  script.onload = async function () {
    const fp     = await FingerprintJS.load();
    const result = await fp.get();

    const webgl  = getWebGL();
    const webgpu = await getWebGPU();

    const payload = {
      visitor_id:           VISITOR_ID,
      fp_id:                result.visitorId,
      canvas_hash:          getCanvasHash(),
      webgl_supported:      webgl.supported,
      webgl_vendor:         webgl.vendor   || "",
      webgl_renderer:       webgl.renderer || "",
      webgl_benchmark_ms:   webgl.benchmark_ms,
      webgpu_supported:     webgpu.supported,
      webgpu_vendor:        webgpu.vendor  || "",
      webgpu_device:        webgpu.device  || "",
      screen:               screen.width + "x" + screen.height + "x" + screen.colorDepth,
      timezone:             Intl.DateTimeFormat().resolvedOptions().timeZone || "",
      language:             navigator.language || "",
      platform:             navigator.platform || "",
      hw_concurrency:       navigator.hardwareConcurrency || 0,
      device_memory:        navigator.deviceMemory || 0,
      plugins_count:        navigator.plugins ? navigator.plugins.length : 0,
      js_exec_time_ms:      Date.now() - t0,
    };

    setTimeout(function() {
      payload.mouse_moves          = behavior.mouse_moves;
      payload.mouse_speed          = mouseSpeed();
      payload.scroll_events        = behavior.scroll_events;
      payload.click_x              = behavior.click_x;
      payload.click_y              = behavior.click_y;
      payload.avg_key_interval_ms  = avgKeyInterval();
      payload.hesitations          = behavior.hesitations;
      payload.first_interaction_ms = behavior.first_interaction;

      fetch(COLLECT_URL, {
        method:    "POST",
        headers:   { "Content-Type": "application/json" },
        body:      JSON.stringify(payload),
        keepalive: true,
      }).catch(function () {});
    }, 3000);
  };

  script.onerror = function () {
    fetch(COLLECT_URL, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ visitor_id: VISITOR_ID, js_exec_time_ms: Date.now() - t0 }),
      keepalive: true,
    }).catch(function () {});
  };

  document.head.appendChild(script);
})();
</script>

</body>
</html>
