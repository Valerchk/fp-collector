# ── IngressClass — Traefik comme contrôleur d'Ingress ──────────
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
---
# ── RBAC — Traefik doit lire les ressources Kubernetes ──────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: gottaphish
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: gottaphish
---
# ── Deployment Traefik ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: gottaphish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.0
          args:
            - "--api.insecure=true"
            - "--providers.kubernetesingress=true"
            - "--entrypoints.web.address=:80"
            - "--accesslog=true"
            - "--accesslog.filepath=/var/log/traefik/access.log"
          ports:
            - containerPort: 80
            - containerPort: 8080
          volumeMounts:
            - name: traefik-logs
              mountPath: /var/log/traefik
      volumes:
        - name: traefik-logs
          hostPath:
            path: /tmp/traefik-logs
            type: DirectoryOrCreate
---
# ── Service Traefik — LoadBalancer pour minikube tunnel ────────
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: gottaphish
spec:
  type: LoadBalancer
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: dashboard
      port: 8080
      targetPort: 8080
