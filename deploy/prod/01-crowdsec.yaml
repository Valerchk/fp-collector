# ── PVC — CrowdSec database (decisions, scenarios) ──────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-db
  namespace: fp-collector
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# ── PVC — Traefik access logs (shared with CrowdSec) ────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traefik-logs
  namespace: fp-collector
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 512Mi
---
# ── CrowdSec deployment ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec
  namespace: fp-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec
  template:
    metadata:
      labels:
        app: crowdsec
    spec:
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik"
            - name: GID
              value: "1000"
          volumeMounts:
            - name: acquis-config
              mountPath: /etc/crowdsec/acquis.yaml
              subPath: acquis.yaml
            - name: crowdsec-db
              mountPath: /var/lib/crowdsec/data
            - name: traefik-logs
              mountPath: /var/log/traefik
              readOnly: true
      volumes:
        - name: acquis-config
          configMap:
            name: crowdsec-acquis
        - name: crowdsec-db
          persistentVolumeClaim:
            claimName: crowdsec-db
        - name: traefik-logs
          persistentVolumeClaim:
            claimName: traefik-logs
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec
  namespace: fp-collector
spec:
  selector:
    app: crowdsec
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-acquis
  namespace: fp-collector
data:
  acquis.yaml: |
    filenames:
      - /var/log/traefik/access.log
    labels:
      type: traefik
