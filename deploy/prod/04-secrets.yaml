# ── API token for /api/stats and /api/export ────────────────────
# Replace the value before applying.
apiVersion: v1
kind: Secret
metadata:
  name: flask-secrets
  namespace: fp-collector
type: Opaque
stringData:
  api_token: "REPLACE_WITH_STRONG_TOKEN"
---
# ── CrowdSec bouncer API key ─────────────────────────────────────
# Generate after CrowdSec pod is running:
#   kubectl exec -n fp-collector deploy/crowdsec -- cscli bouncers add traefik-bouncer
# Then paste the output key below and apply this file.
apiVersion: v1
kind: Secret
metadata:
  name: crowdsec-bouncer-key
  namespace: fp-collector
type: Opaque
stringData:
  key: "REPLACE_WITH_GENERATED_KEY"
